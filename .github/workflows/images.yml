name: Native images
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: false
      aliases:
        type: string
        default: ''
# Permissions inherited from caller: read-only CI, packages:write publishing.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build native runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: quasard-check:local
          build-args: |
            VERSION=${{ inputs.tag }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=native-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=native-${{ matrix.arch }}
      - name: Check loader and restricted codec
        run: sh scripts/check-image.sh quasard-check:local "$RUNNER_TEMP/codec-check"
      - name: Check release bundle export and launchers
        env:
          VERSION: ${{ inputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          sh scripts/build-release.sh "$VERSION" "$ARCH" "$RUNNER_TEMP/bundles"
          mkdir "$RUNNER_TEMP/bundle check"
          tar -xzf "$RUNNER_TEMP/bundles/quasard-$VERSION-linux-$ARCH.tar.gz" -C "$RUNNER_TEMP/bundle check"
          root="$RUNNER_TEMP/bundle check/quasard-$VERSION-linux-$ARCH"
          "$root/quasard" --version
          "$root/quasard-tools" --version
          "$root/bin/ffmpeg" -version
      - name: Registry login
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architecture with provenance
        if: inputs.publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            VERSION=${{ inputs.tag }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.licenses=GPL-3.0-only
          provenance: true
          sbom: true
          cache-from: type=gha,scope=native-${{ matrix.arch }}
  manifest:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multiarch tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ inputs.tag }}
          ALIASES: ${{ inputs.aliases }}
          SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for tag in "$TAG" $ALIASES; do
            docker buildx imagetools create --tag "$IMAGE:$tag" "$IMAGE:$TAG-amd64-$SUFFIX" "$IMAGE:$TAG-arm64-$SUFFIX"
          done
