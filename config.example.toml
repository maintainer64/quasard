# Go CPU-only backend. Скопируйте в config.toml; личный конфиг не хранится в Git.
# Локальные порты Docker Compose, без перенастройки колонки/сети.
# ALICE_<SECTION>_<KEY> переопределяет значение файла.
# GigaAM, F5/Edge/remote TTS и CUDA не поддерживаются: старый конфиг нужно перенести.
[server]
host = "0.0.0.0"
http_port = 8080
https_port = 8443
certfile = "certs/server.crt"
keyfile = "certs/server.key"
data_dir = "data"
public_uniproxy_url = ""
log_level = "INFO"
log_traffic = false # Полный legacy traffic logging пока не реализован.

# Optional DNS: exact rewrites/blocks, all other names forwarded. Not an HTTP proxy.
# Enable LAN access only with explicit client ACL and LAN-IP answer.
# Reload only this section with SIGHUP; Docker port mappings need recreation.
[dns]
enabled = false
listen = "127.0.0.1:5353"
upstreams = ["1.1.1.1:53", "9.9.9.9:53"]
answer_ipv4 = "" # Host LAN IPv4, not Docker container address.
answer_ipv6 = "" # Empty: rewritten names return no AAAA, not upstream IPv6.
rewrite_hosts = [] # E.g. ["quasar.yandex.net", "uniproxy.alice.yandex.net"].
block_hosts = [] # Exact names only, all IN types return NXDOMAIN; no subdomains/overlap.
log_queries = false # Opt-in slog metadata (names are sensitive), max 100/sec globally.
# Logs: REWRITE/FORWARD/BLOCK, qname/qtype/transport/rcode/duration; no packets/client ID.
allow_cidrs = [] # LAN listener requires explicit CIDRs, preferably STATION_IP/32.
ttl = 30
timeout_ms = 2000
max_concurrent = 64
max_tcp_connections = 32
rate_limit = 100 # Global queries/sec for UDP+TCP; excess UDP drops, TCP closes.

[asr]
engine = "vosk"
model = "vosk-model-small-ru-0.22"
model_path = "models/vosk-model-small-ru-0.22"
vad_model_path = "alice_server/assets/silero_vad.onnx"
device = "cpu"
language = "ru"
vad_silence_ms = 700
vad_threshold = 0.5
vad_energy_db = -68.0
max_utterance_ms = 10000
no_speech_timeout_ms = 5000
partial_interval_ms = 300

[tts]
engine = "piper"
model = "models/ru_RU-dmitri-medium.onnx"
config_path = "models/ru_RU-dmitri-medium.onnx.json"

[llm]
# echo — локальная заглушка, не реальная LLM, платный API не вызывается.
# Для реального SSE задайте OpenAI-совместимые base_url/model и ALICE_LLM_API_KEY.
model = "echo"
base_url = "http://127.0.0.1:8099/v1"
api_key = ""
temperature = 0.6
max_tokens = 400
timeout_s = 60
history_turns = 8
history_ttl_s = 300
listen_after_question = true
hold_response_ms = 400
extra_body = {}
# Optional model IDs on the SAME base_url/API key. Empty keeps model above.
# Script-majority heuristic on ASR/text input; mixed ties/numbers use model.
model_ru = ""
model_en = ""
max_tool_calls = 4 # Automatic tool chain budget per request; no confirmation.

[mcp]
enabled = false
# Streamable HTTP only. No stdio commands; tools run automatically.
# HTTP only on loopback; use HTTPS for remote endpoints.
# [[mcp.servers]]
# name = "home"
# url = "https://mcp.example.org/mcp"
# token_env = "HOME_MCP_TOKEN" # Secret value comes from environment, not TOML.
# allowed_tools = ["weather"] # Optional restriction; omitted/[] allows all.

[music]
enabled = true
token = ""
quality = "mp3"

[device]
timezone = "Europe/Moscow"
